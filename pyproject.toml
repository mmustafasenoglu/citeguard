[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citeguard"
version = "1.0.1"
description = "Find missing citations, verify existing references, and audit academic writing from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "citeguard contributors" }]
keywords = ["citations", "academic-writing", "research", "cli", "bibliography"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "click>=8.1,<9",
  "python-docx>=1.1,<2",
  "rich>=13.7,<16",
  "python-dotenv>=1.0,<2",
  "nltk>=3.8",
  "scikit-learn>=1.4",
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=2.2,<4",
]
dev = [
  "build>=1,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
citeguard = "citeguard.cli:main"

[project.urls]
Homepage = "https://github.com/mmustafasenoglu/citeguard"
Repository = "https://github.com/mmustafasenoglu/citeguard"
Issues = "https://github.com/mmustafasenoglu/citeguard/issues"

[tool.setuptools]
packages = [
  "citeguard",
  "citeguard.providers",
  "citeguard.corpus",
  "citeguard.similarity",
  "citeguard.similarity.embeddings",
  "citeguard.reduction",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_llm: marks tests that call real LLM providers (deselect with '-m not live_llm')",
    "contract: marks release contract tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
